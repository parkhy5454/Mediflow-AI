name: Daily Subscription Billing

"on":
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  run-billing:
    runs-on: ubuntu-latest
    steps:
      - name: Call run-billing endpoint
        run: |
          curl -sf -X POST "https://mediflow-ai-web.onrender.com/api/subscription/run-billing" -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" -H "Content-Type: application/json" -o response.json -w "HTTP status: %{http_code}\n"
          cat response.json
